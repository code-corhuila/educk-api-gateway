# Rate limiting zones per domain
limit_req_zone $binary_remote_addr zone=rl_identity:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=rl_academic:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=rl_attendance:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=rl_communication:10m rate=10r/s;
limit_req_status 429;

# CORS: only the front-end origins. Never '*' together with credentials.
map $http_origin $cors_origin {
    default                     "";
    "http://localhost:3000"     $http_origin;
    "http://localhost:3001"     $http_origin;
    "http://localhost:3002"     $http_origin;
    "http://localhost:3003"     $http_origin;
    "http://localhost:3004"     $http_origin;
    "http://localhost:3005"     $http_origin;
}

# Correlation: reuse the X-Correlation-Id the client sent, or create one. It goes
# to the service, back to the client, and into every access-log line.
map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

# Cheap authentication filter: every protected route requires an Authorization
# header carrying a Bearer scheme before reaching any backend service.
# This is NOT cryptographic verification: each service verifies the RS256 JWT itself.
map $http_authorization $missing_auth {
    default           1;
    "~*^Bearer\s+\S+" 0;
}
