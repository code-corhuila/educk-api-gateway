add_header X-Correlation-Id $req_correlation_id always;
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Correlation-Id" always;
add_header Access-Control-Expose-Headers "X-Correlation-Id, Location" always;
