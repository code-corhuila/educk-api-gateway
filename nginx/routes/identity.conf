location /api/v1/auth {
    if ($request_method = OPTIONS) { return 204; }
    default_type application/json;
    limit_req zone=rl_identity burst=20 nodelay;
    set $identity_api http://educk-identity-api:8081;
    proxy_pass $identity_api;
}

location /api/v1/users {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=rl_identity burst=20 nodelay;
    set $identity_api http://educk-identity-api:8081;
    proxy_pass $identity_api;
}
