location /api/v1/attendance {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=rl_attendance burst=20 nodelay;
    set $attendance_api http://educk-attendance-api:8083;
    proxy_pass $attendance_api;
}
