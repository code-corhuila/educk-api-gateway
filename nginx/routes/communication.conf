location /api/v1/communication/ {
    limit_req zone=api_limit burst=20 nodelay;
    if ($http_authorization = "") { return 401; }
    set $communication_api http://educk-communication-api:8085;
    proxy_pass $communication_api;
    proxy_set_header X-Correlation-Id $req_correlation_id;
    include /etc/nginx/snippets/headers.conf;
}
