location /api/v1/messages {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=rl_communication burst=20 nodelay;
    set $communication_api http://educk-communication-api:8085;
    proxy_pass $communication_api;
}
