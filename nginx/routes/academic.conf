location /api/v1/courses {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=rl_academic burst=20 nodelay;
    set $academic_api http://educk-academic-api:8082;
    proxy_pass $academic_api;
}

location /api/v1/grades {
    if ($request_method = OPTIONS) { return 204; }
